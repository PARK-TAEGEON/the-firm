<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE FIRM · 글꼴 후보</title>
<!-- 글꼴: Google Fonts (인터넷 연결 시 적용, 오프라인이면 시스템 글꼴로 대체) -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@600;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Gothic+A1:wght@400;500;700&amp;family=Hahmlet:wght@600;700&amp;family=Nanum+Gothic:wght@400;700&amp;family=Nanum+Myeongjo:wght@700&amp;family=Nanum+Gothic+Coding:wght@400;700&amp;family=Gowun+Dodum&amp;family=Gowun+Batang:wght@700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Orbit&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 1440px; min-height: 2400px; box-sizing: border-box; padding: 56px 64px; background: #0E1114; color: #E3EAEC; font-family: 'IBM Plex Sans KR', 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; gap: 6px">
  <div style="display: flex; align-items: flex-end; gap: 20px; padding-bottom: 16px">
    <h1 style="margin: 0; font-size: 36px; font-weight: 700">글꼴 후보 · C Verdict Graphite</h1>
    <span style="font-size: 16px; color: #9AA7AE; padding-bottom: 6px">검토 바 › 글꼴에서 프로토타입에 바로 적용</span>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 18px 0 10px">
    <span style="font-size: 20px; font-weight: 700; color: #6FD0D2">바로 미리보기</span>
    <span style="font-size: 14px; color: #9AA7AE">Google Fonts · 설치 없이 보임</span>
  </div>
  <sc-for list="{{ live }}" as="r" hint-placeholder-count="10">
    <div style="display: grid; grid-template-columns: 300px minmax(0, 1fr) 360px; gap: 20px; padding: 16px 0; border-top: 1px solid #29313A; align-items: stretch">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; gap: 8px; align-items: center"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: #6FD0D2">{{ r.code }}</span><span style="font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 3px; border: 1px solid #3A4450; color: #C5CED2">{{ r.tag }}</span></span>
        <span style="font-size: 18px; font-weight: 700; line-height: 1.3">{{ r.name }}</span>
        <span style="font-size: 14px; color: #9AA7AE">{{ r.note }}</span>
      </div>
      <div style="background: #171C21; border: 1px solid #29313A; border-radius: 3px; padding: 14px 18px; display: flex; flex-direction: column; gap: 6px; font-family: {{ r.body }}">
        <span style="font-family: {{ r.disp }}; font-size: 22px; font-weight: 700; line-height: 1.25">정민호 · 변론 계획</span>
        <span style="font-size: 15px">현재 확보한 자료로 확인 가능한 범위를 정리</span>
        <span style="font-size: 13px; color: #9AA7AE">김현우 · 형사·증거 · 배정 충돌</span>
      </div>
      <div style="background: #171C21; border: 1px solid #29313A; border-radius: 3px; padding: 14px 18px; display: flex; flex-direction: column; justify-content: center; gap: 4px; font-family: {{ r.num }}; font-variant-numeric: tabular-nums">
        <span style="font-size: 24px; font-weight: 700; color: #6FD0D2">₩18,200,000</span>
        <span style="font-size: 15px; color: #C5CED2">2026-001 · 06.18 D-6 · 0h / 12h</span>
      </div>
    </div>
  </sc-for>

  <div style="display: flex; align-items: center; gap: 12px; padding: 34px 0 10px">
    <span style="font-size: 20px; font-weight: 700; color: #6FD0D2">설치형 후보</span>
    <span style="font-size: 14px; color: #9AA7AE">PC에 설치된 경우에만 보임 · 미설치면 맑은 고딕으로 대체됨</span>
  </div>
  <sc-for list="{{ local }}" as="r" hint-placeholder-count="9">
    <div style="display: grid; grid-template-columns: 300px minmax(0, 1fr) 360px; gap: 20px; padding: 14px 0; border-top: 1px solid #29313A; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 3px; border: 1px solid #3A4450; color: #C5CED2; align-self: flex-start">{{ r.tag }}</span>
        <span style="font-size: 18px; font-weight: 700">{{ r.name }}</span>
        <span style="font-size: 14px; color: #9AA7AE">{{ r.note }}</span>
      </div>
      <div style="background: #171C21; border: 1px dashed #3A4450; border-radius: 3px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; font-family: {{ r.fam }}">
        <span style="font-size: 22px; font-weight: 700">정민호 · 변론 계획</span>
        <span style="font-size: 15px">현재 확보한 자료로 확인 가능한 범위를 정리</span>
      </div>
      <div style="font-family: {{ r.fam }}; font-size: 22px; font-weight: 700; color: #6FD0D2; font-variant-numeric: tabular-nums">₩18,200,000 · 06.18</div>
    </div>
  </sc-for>
  <p style="margin: 24px 0 0; font-size: 14px; color: #9AA7AE">라이선스는 대부분 OFL 등 무료 상업 이용 계열로 알려져 있으나, 게임에 포함해 배포하기 전 각 배포처의 라이선스 원문을 확인하세요.</p>
</div>
</template>
