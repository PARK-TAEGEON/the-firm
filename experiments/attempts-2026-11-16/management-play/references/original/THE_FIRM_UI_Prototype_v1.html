<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE FIRM · UI 프로토타입</title>
<!-- 글꼴: Google Fonts (인터넷 연결 시 적용, 오프라인이면 시스템 글꼴로 대체) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;family=Noto+Serif+KR:wght@600;700&amp;family=IBM+Plex+Sans+KR:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=Gothic+A1:wght@400;500;700;800&amp;family=Hahmlet:wght@500;600;700&amp;family=Nanum+Gothic:wght@400;700;800&amp;family=Nanum+Myeongjo:wght@700;800&amp;family=Nanum+Gothic+Coding:wght@400;700&amp;family=Gowun+Dodum&amp;family=Gowun+Batang:wght@400;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;family=Orbit&amp;family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=Rajdhani:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
.app,.app *,.app *::before,.app *::after{box-sizing:border-box}
.app{-webkit-font-smoothing:antialiased}

/* ===== A · Navy & Brass ===== */
.app.tA{--bg:#0D1828;--stripe:rgba(201,164,94,.045);--panel:#16263B;--phead:#1B2E47;--raise:#22395A;--inset:#112033;--line:#263D5A;--line2:#3A5578;--fg:#F2EEE4;--muted:#A8B4C2;--accent:#C9A45E;--accent2:#E0C083;--on-accent:#111B29;--accent-soft:rgba(201,164,94,.15);--sel:rgba(201,164,94,.17);--hover:rgba(242,238,228,.05);--focus:#8EC1F0;--danger:#FF8A80;--on-danger:#2A0E0B;--danger-soft:rgba(255,138,128,.13);--warn:#F4A259;--warn-soft:rgba(244,162,89,.13);--ok:#7FD1A0;--ok-soft:rgba(127,209,160,.13);--info:#8EC1F0;--info-soft:rgba(142,193,240,.13);--top:#08111D;--top2:#0F1C2E;--top2-fg:#F2EEE4;--top-fg:#F2EEE4;--top-muted:#A8B4C2;--top-line:#1F3350;--top-accent:#C9A45E;--font:"Wanted Sans","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--font-display:"MaruBuri","Hahmlet","Noto Serif KR",serif;--font-num:inherit;--radius:6px;--chip-radius:999px;--shadow:0 18px 48px rgba(3,8,16,.6);--scrim:rgba(4,9,16,.66)}
/* ===== B · Paper & Ink ===== */
.app.tB{--bg:#E7E1D3;--stripe:rgba(30,42,52,.04);--panel:#FFFDF8;--phead:#F5F0E5;--raise:#FFFFFF;--inset:#F7F3EA;--line:#DCD3C2;--line2:#BBAF99;--fg:#1E2A34;--muted:#56606A;--accent:#23476E;--accent2:#23476E;--on-accent:#FFFFFF;--accent-soft:rgba(35,71,110,.09);--sel:#E3EAF2;--hover:rgba(30,42,52,.04);--focus:#B4570F;--danger:#B3261E;--on-danger:#FFFFFF;--danger-soft:#FBE9E7;--warn:#8F5200;--warn-soft:#FBF0DE;--ok:#2E6B3A;--ok-soft:#E6F1E7;--info:#1F6A7A;--info-soft:#E3F0F2;--top:#1E2A34;--top2:#F5F0E5;--top2-fg:#1E2A34;--top-fg:#F2EEE4;--top-muted:#B9C2CA;--top-line:#33424F;--top-accent:#D7B98A;--font:"SUIT","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--font-display:"MaruBuri","Noto Serif KR",serif;--font-num:inherit;--radius:4px;--chip-radius:3px;--shadow:0 16px 40px rgba(30,42,52,.2);--scrim:rgba(30,42,52,.45)}
/* ===== C · Verdict Graphite ===== */
.app.tC{--bg:#0E1114;--stripe:rgba(63,167,169,.035);--panel:#171C21;--phead:#1D232A;--raise:#252C34;--inset:#12161A;--line:#29313A;--line2:#3A4450;--fg:#E3EAEC;--muted:#9AA7AE;--accent:#3FA7A9;--accent2:#6FD0D2;--on-accent:#071314;--accent-soft:rgba(63,167,169,.15);--sel:rgba(63,167,169,.18);--hover:rgba(227,234,236,.045);--focus:#8DBFF0;--danger:#FF8F85;--on-danger:#2A0E0B;--danger-soft:rgba(255,143,133,.13);--warn:#EDB95E;--warn-soft:rgba(237,185,94,.12);--ok:#86D49B;--ok-soft:rgba(134,212,155,.12);--info:#8DBFF0;--info-soft:rgba(141,191,240,.12);--top:#090B0D;--top2:#12161A;--top2-fg:#E3EAEC;--top-fg:#E3EAEC;--top-muted:#9AA7AE;--top-line:#20262D;--top-accent:#3FA7A9;--font:"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;--font-display:"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;--font-num:"IBM Plex Mono",ui-monospace,monospace;--radius:3px;--chip-radius:3px;--shadow:0 18px 48px rgba(0,0,0,.65);--scrim:rgba(0,0,0,.62)}
/* ===== font candidates ===== */
.app.f1{--font:"Noto Sans KR","Malgun Gothic",sans-serif;--font-display:"Noto Serif KR",serif;--font-num:inherit}
.app.f2{--font:"IBM Plex Sans KR","Malgun Gothic",sans-serif;--font-display:"IBM Plex Sans KR","Malgun Gothic",sans-serif;--font-num:"IBM Plex Mono",ui-monospace,monospace}
.app.f3{--font:"Gothic A1","Malgun Gothic",sans-serif;--font-display:"Hahmlet",serif;--font-num:inherit}
.app.f4{--font:"Nanum Gothic","Malgun Gothic",sans-serif;--font-display:"Nanum Myeongjo",serif;--font-num:"Nanum Gothic Coding",monospace}
.app.f5{--font:"Gowun Dodum","Malgun Gothic",sans-serif;--font-display:"Gowun Batang",serif;--font-num:inherit}
.app.f6{--font:"Noto Sans KR","Malgun Gothic",sans-serif;--font-display:"Noto Sans KR","Malgun Gothic",sans-serif;--font-num:"JetBrains Mono","Noto Sans KR",monospace}
.app.f7{--font:"IBM Plex Sans KR","Malgun Gothic",sans-serif;--font-display:"IBM Plex Sans KR","Malgun Gothic",sans-serif;--font-num:"Barlow Semi Condensed","IBM Plex Sans KR",sans-serif}
.app.f8{--font:"IBM Plex Sans KR","Malgun Gothic",sans-serif;--font-display:"Orbit","IBM Plex Sans KR",sans-serif;--font-num:"IBM Plex Mono","IBM Plex Sans KR",monospace}
.app.f9{--font:"Gothic A1","Malgun Gothic",sans-serif;--font-display:"Gothic A1","Malgun Gothic",sans-serif;--font-num:"Rajdhani","Gothic A1",sans-serif}
/* ===== C palette candidates ===== */
.app.tC.pc2{--accent:#CDA349;--accent2:#E3C27A;--on-accent:#14110A;--accent-soft:rgba(205,163,73,.15);--sel:rgba(205,163,73,.16);--stripe:rgba(205,163,73,.035);--top-accent:#CDA349;--warn:#F59E5B;--warn-soft:rgba(245,158,91,.13)}
.app.tC.pc3{--bg:#0D1117;--panel:#161B22;--phead:#1C222B;--raise:#232A35;--inset:#10151B;--line:#283039;--line2:#3A4451;--accent:#5B9BE0;--accent2:#8DBBF0;--on-accent:#08111C;--accent-soft:rgba(91,155,224,.16);--sel:rgba(91,155,224,.18);--stripe:rgba(91,155,224,.035);--info:#7FD3E0;--info-soft:rgba(127,211,224,.12);--focus:#F2C14E;--top:#080B10;--top2:#10151B;--top-line:#1E252E;--top-accent:#5B9BE0}
.app.tC.pc4{--accent:#C9D2D8;--accent2:#E8EEF1;--on-accent:#0E1114;--accent-soft:rgba(201,210,216,.11);--sel:rgba(201,210,216,.12);--stripe:rgba(255,255,255,.025);--top-accent:#E8EEF1}
.app.tC.pc5{--bg:#121010;--panel:#1B1817;--phead:#221E1C;--raise:#2B2624;--inset:#151312;--line:#312B28;--line2:#453D39;--fg:#ECE6E1;--muted:#A99F98;--accent:#E07A4F;--accent2:#F0A07C;--on-accent:#1A0D07;--accent-soft:rgba(224,122,79,.16);--sel:rgba(224,122,79,.17);--stripe:rgba(224,122,79,.035);--danger:#FF6B81;--danger-soft:rgba(255,107,129,.13);--warn:#EEC25A;--warn-soft:rgba(238,194,90,.12);--top:#0B0A09;--top2:#151312;--top-fg:#ECE6E1;--top2-fg:#ECE6E1;--top-muted:#A99F98;--top-line:#26211F;--top-accent:#E07A4F}

.app :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.app button{font-family:inherit;font-size:inherit}
.app ::-webkit-scrollbar{width:10px;height:10px}
.app ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:2px solid transparent;background-clip:padding-box}
.app ::-webkit-scrollbar-track{background:transparent}
.ground{background-color:var(--bg);background-image:repeating-linear-gradient(90deg,var(--stripe) 0 1px,transparent 1px 8px)}
svg.i,.chip svg,.btn svg,.tbtn svg,.ttl svg,.navchev svg,.sc svg,.alert svg,.thumb svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i{width:18px;height:18px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.disp{font-family:var(--font-display)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* review strip */
.rv-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:4px;border:1px solid #3A414B;background:#161A20;color:#E6E8EB;font-size:13px;font-weight:600;cursor:pointer}
.rv-btn:hover{background:#20262E}
.rv-btn.on{background:#E6E8EB;color:#0B0D10;border-color:#E6E8EB}
.rv-sw{width:10px;height:10px;border-radius:2px;border:1px solid rgba(255,255,255,.35)}
.rv-sel{height:28px;border-radius:4px;border:1px solid #3A414B;background:#161A20;color:#E6E8EB;font:inherit;font-size:13px;padding:0 6px}

/* top bar */
.top{height:64px;flex:none;background:var(--top);color:var(--top-fg);display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--top-line);position:relative;z-index:50}
.tbtn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius);border:1px solid var(--top-line);background:rgba(255,255,255,.03);color:var(--top-fg);cursor:pointer;position:relative}
.tbtn:hover{background:rgba(255,255,255,.08)}
.tbtn:disabled{color:var(--top-muted);opacity:.45;cursor:not-allowed}
.tbtn svg{width:18px;height:18px}
.badge{position:absolute;top:-6px;right:-7px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--danger);color:var(--on-danger);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--top-fg);cursor:pointer;padding:4px 8px 4px 4px;border-radius:var(--radius)}
.mark{width:34px;height:34px;border:2px solid var(--top-accent);border-radius:3px;position:relative;flex:none}
.mark::before{content:"";position:absolute;left:6px;right:6px;top:6px;height:3px;background:var(--top-accent)}
.mark::after{content:"";position:absolute;left:12px;width:6px;top:11px;bottom:5px;background:var(--top-accent)}
.wordmark{font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:.1em;white-space:nowrap}
.gnav{display:flex;align-items:stretch;height:64px;min-width:0}
.navgrp{position:relative;display:flex;align-items:stretch}
.navbtn{height:64px;padding:0 4px 0 12px;background:none;border:0;color:var(--top-muted);font-size:15px;font-weight:700;cursor:pointer;position:relative;white-space:nowrap;letter-spacing:.01em}
.navbtn:hover{color:var(--top-fg)}
.navgrp.on .navbtn{color:var(--top-fg)}
.navgrp.on::after{content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;background:var(--top-accent)}
.navchev{width:26px;background:none;border:0;color:var(--top-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;margin-right:4px}
.navchev:hover,.navchev[aria-expanded="true"]{color:var(--top-fg)}
.navchev svg{width:14px;height:14px}
.dd{position:absolute;top:58px;left:4px;min-width:200px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px;z-index:60;display:flex;flex-direction:column}
.dd button{display:flex;align-items:center;justify-content:space-between;gap:16px;height:40px;padding:0 12px;border:0;border-radius:calc(var(--radius) - 2px);background:none;color:var(--fg);font-size:15px;font-weight:600;cursor:pointer;text-align:left;white-space:nowrap}
.dd button:hover{background:var(--hover)}
.dd button.on{color:var(--accent2);background:var(--accent-soft)}
.ddback{position:fixed;inset:0;background:transparent;border:0;z-index:45;cursor:default}
.datebox{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.2;height:48px;padding:0 12px;white-space:nowrap;border:1px solid var(--top-line);border-radius:var(--radius);background:rgba(255,255,255,.03)}
.cont{display:flex;align-items:center;gap:14px;height:48px;min-width:196px;justify-content:space-between;padding:0 14px 0 18px;border-radius:var(--radius);border:0;cursor:pointer;text-align:left;white-space:nowrap}
.cont.blocked{background:var(--danger);color:var(--on-danger)}
.cont.go{background:var(--accent);color:var(--on-accent)}
.cont:hover{filter:brightness(1.07)}
.cont svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}

/* sub bar */
.sub{height:44px;flex:none;background:var(--top2);color:var(--top2-fg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:0 14px;overflow-x:auto}
.ctx{font-size:15px;font-weight:800;padding-right:14px;margin-right:6px;border-right:1px solid var(--line);white-space:nowrap;display:flex;align-items:center;gap:6px}
.ctx .muted{font-weight:600}
.subtab{height:44px;padding:0 12px;border:0;background:none;color:var(--muted);font-size:15px;font-weight:600;cursor:pointer;position:relative;white-space:nowrap}
.subtab:hover{color:var(--fg)}
.subtab.on{color:var(--fg);font-weight:800}
.subtab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:2px;background:var(--accent)}
.sc{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.sc:hover{background:var(--raise)}
.sc svg{width:15px;height:15px}
.sc .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:var(--on-danger);font-size:11px;display:inline-flex;align-items:center;justify-content:center}
.sc .cnt.n{background:var(--line2);color:var(--fg)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-width:0;box-shadow:0 1px 0 rgba(255,255,255,.03) inset}
.phd{display:flex;align-items:center;gap:10px;padding:0 14px;min-height:46px;background:var(--phead);border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;flex-wrap:wrap}
.ttl{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:var(--accent2);font-size:15px;font-weight:800;cursor:pointer;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:6px;text-decoration-color:color-mix(in srgb,var(--accent) 55%,transparent);white-space:nowrap}
.ttl:hover{text-decoration-color:var(--accent2)}
.ttl.static{cursor:default}
.ttl svg{width:14px;height:14px}
.h1{margin:0;font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.2}
.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 14px;border-radius:var(--radius);border:1px solid var(--line2);background:var(--raise);color:var(--fg);font-size:15px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{cursor:not-allowed;color:var(--muted);background:var(--inset);border-color:var(--line);filter:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{background:var(--inset);border-color:var(--line);color:var(--muted)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--hover);filter:none}
.btn.sm{height:32px;padding:0 10px;font-size:14px}
.btn svg{width:16px;height:16px}
.iconbtn{width:34px;height:34px;padding:0}
.lnk{background:none;border:0;padding:0;color:var(--fg);font-weight:700;cursor:pointer;text-align:left}
.lnk:hover{color:var(--accent2);text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:var(--chip-radius);font-size:13px;font-weight:700;white-space:nowrap;border:1px solid transparent;line-height:1}
.chip svg{width:14px;height:14px;stroke-width:2.4}
.c-danger{color:var(--danger);background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.c-warn{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.c-ok{color:var(--ok);background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.c-info{color:var(--info);background:var(--info-soft);border-color:color-mix(in srgb,var(--info) 40%,transparent)}
.c-accent{color:var(--accent2);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.c-neutral{color:var(--muted);background:var(--inset);border-color:var(--line)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:3px;font-size:12px;font-weight:800;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.acc{border-color:var(--accent);color:var(--accent2)}
.mockt{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:3px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;color:var(--warn);border:1px dashed var(--warn);letter-spacing:.04em;white-space:nowrap}
.kv{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 12px;font-size:15px;margin:0}
.kv dt{color:var(--muted);font-size:14px;margin:0}
.kv dd{margin:0;min-width:0}
.note{font-size:14px;color:var(--muted);line-height:1.5}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:28px 20px;color:var(--muted);font-size:15px}
.errbox{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;margin:14px;border-radius:var(--radius);background:var(--danger-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--danger) 45%,transparent)}
.skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--inset) 0%,var(--raise) 50%,var(--inset) 100%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* avatar / role block / hour pill */
.av{width:32px;height:32px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;background:var(--raise);color:var(--fg);border:1px solid var(--line2)}
.av.lg{width:72px;height:72px;font-size:22px;border-width:2px;border-color:var(--accent)}
.rb{display:inline-flex;align-items:center;justify-content:center;width:46px;height:28px;border-radius:3px;font-size:13px;font-weight:800;letter-spacing:.02em}
.rb-lead{background:var(--accent);color:var(--on-accent)}
.rb-law{background:var(--info-soft);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 45%,transparent)}
.rb-ops{background:var(--inset);color:var(--muted);border:1px solid var(--line2)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:26px;padding:0 8px;border-radius:13px;font-size:14px;font-weight:800;font-family:var(--font-num);font-variant-numeric:tabular-nums}
.p-danger{background:var(--danger);color:var(--on-danger)}
.p-ok{background:var(--ok-soft);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 45%,transparent)}
.p-neutral{background:var(--inset);color:var(--fg);border:1px solid var(--line2)}

/* grid tables */
.thead{background:var(--phead);color:var(--muted);font-size:13px;font-weight:700;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
.thead>div{padding:10px 12px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.sortbtn{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.sortbtn:hover,.sortbtn.on{color:var(--fg)}
.trow{border-bottom:1px solid var(--line);min-height:54px;font-size:15px}
.trow>div{padding:8px 12px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:10px}
.trow.click{cursor:pointer}
.trow.click:hover{background:var(--hover)}
.trow.sel,.trow.sel:hover{background:var(--sel)}
.selbtn{width:22px;height:22px;border-radius:50%;border:2px solid var(--line2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.selbtn span{width:10px;height:10px;border-radius:50%}
.selbtn.on{border-color:var(--accent)}
.selbtn.on span{background:var(--accent)}
.g-p01{display:grid;grid-template-columns:44px 62px minmax(150px,1.3fr) minmax(100px,1fr) 124px 70px minmax(100px,1fr) 76px minmax(130px,1fr) 48px;align-items:stretch}
.g-case{display:grid;grid-template-columns:minmax(0,1fr) 106px 70px;align-items:stretch}
.danger-text{color:var(--danger);font-weight:800}

/* lists */
.li{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 16px;color:var(--fg);cursor:pointer}
.li:hover{background:var(--hover)}
.li.sel{background:var(--sel)}
.li .row1{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.li .subj{font-size:15px;font-weight:500;line-height:1.35;color:var(--muted)}
.li.unread .subj{font-weight:800;color:var(--fg)}
.grp{padding:7px 16px;font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--muted);background:var(--inset);border-bottom:1px solid var(--line)}
.grp.dang{color:var(--danger);background:var(--danger-soft)}
.ftab{height:30px;padding:0 10px;border-radius:var(--radius);border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.ftab.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* D01 portal */
.d01{display:grid;grid-template-columns:340px minmax(0,1fr) 330px;gap:14px;padding:14px;height:100%;min-height:0}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
.c2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1279px){.d01{grid-template-columns:minmax(0,1fr);height:auto}.col{overflow:visible}.c2{grid-template-columns:minmax(0,1fr)}}
.deccard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:var(--radius);background:var(--danger-soft);border:1px solid color-mix(in srgb,var(--danger) 45%,transparent);color:var(--fg);cursor:pointer}
.deccard:hover{filter:brightness(1.08)}
.deccard svg{width:22px;height:22px;color:var(--danger)}
.emblem{position:relative;height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;background-color:var(--accent-soft);background-image:repeating-linear-gradient(90deg,color-mix(in srgb,var(--accent) 18%,transparent) 0 1px,transparent 1px 10px);border-bottom:1px solid var(--line)}
.emblem .glyph{font-family:var(--font-display);font-size:78px;font-weight:700;color:var(--accent2);line-height:1}
.emblem .eid{position:absolute;left:12px;bottom:10px;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--accent2);letter-spacing:.06em}
.emblem .chip{position:absolute;right:12px;top:12px}
.newsrow{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;background:none;border:0;border-top:1px solid var(--line);color:var(--fg);cursor:pointer}
.newsrow:hover{background:var(--hover)}
.thumb{width:48px;height:48px;border-radius:var(--radius);flex:none;display:flex;align-items:center;justify-content:center;background:var(--inset);border:1px solid var(--line);color:var(--accent2)}
.thumb svg{width:22px;height:22px}
.big{font-family:var(--font-num);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--accent2);line-height:1.15}
.week{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;padding:12px 12px 4px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:var(--radius);background:var(--inset);border:1px solid var(--line);font-size:12px;color:var(--muted)}
.day b{font-family:var(--font-num);font-size:15px;color:var(--fg)}
.day.today{border-color:var(--accent);background:var(--accent-soft)}
.day.ev{color:var(--fg)}
.day .mk{width:6px;height:6px;border-radius:50%;background:transparent}
.day.ev .mk{background:var(--accent2)}
.evrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;background:none;border:0;border-top:1px solid var(--line);color:var(--fg);cursor:pointer;font-size:15px;font-weight:600}
.evrow:hover{background:var(--hover)}
.srow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}

/* object header (FM club-overview structure) */
.objband{display:flex;align-items:center;gap:20px;padding:14px 20px;background:var(--phead);border-bottom:1px solid var(--line);flex-wrap:wrap;flex:none}
.crest{width:58px;height:58px;border-radius:var(--radius);border:2px solid var(--accent);background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--accent2);flex:none}
.meta{display:flex;flex-direction:column;gap:3px;padding:0 18px;border-left:1px solid var(--line);min-width:0}
.meta .v{font-size:16px;font-weight:800;white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;padding:14px 20px 0;flex:none}
.tile{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);text-align:left;color:var(--fg);cursor:pointer}
.tile:hover{background:var(--raise)}
.tile .v{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.tile.dang{border-color:color-mix(in srgb,var(--danger) 50%,transparent)}
.tile.dang .v{color:var(--danger)}

/* side drawer */
.side{flex:none;min-height:0;overflow:auto}
@media (max-width:1279px){.side{position:absolute;top:0;right:0;bottom:0;z-index:20;box-shadow:var(--shadow)}}

/* M06 */
.iss{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;color:var(--fg);cursor:pointer}
.iss:hover{background:var(--raise)}
.iss.sel{background:var(--sel);border-color:var(--accent)}
.sect{display:flex;flex-direction:column;gap:10px}
.sect-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mat{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.chev{transition:transform .15s}
.chev.open{transform:rotate(90deg)}
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{display:flex;flex-direction:column;gap:3px;padding:8px 10px;border-radius:var(--radius);border:1px solid var(--line);background:var(--inset);min-width:0}
.step .sl{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:800;white-space:nowrap}
.step .sl svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.step .sn{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-done{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.s-done .sl{color:var(--ok)}
.s-pending{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.s-pending .sl{color:var(--warn)}
.s-unknown{border-style:dashed}
.s-unknown .sl,.s-no .sl{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.seg button{height:32px;padding:0 14px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:800;cursor:pointer}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.usebox{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;white-space:nowrap;cursor:pointer}
.usebox input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.usebox.dis{color:var(--muted);cursor:not-allowed}
.lc{display:inline-flex;align-items:center;height:28px;font-size:13px;font-weight:800;color:var(--muted);padding:0 10px;border-radius:var(--chip-radius);border:1px solid var(--line);white-space:nowrap}
.lc.cur{color:var(--on-accent);border-color:var(--accent);background:var(--accent)}
.lc.fut{border-style:dashed}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--radius);font-size:14px;line-height:1.45;width:100%;text-align:left;border:1px solid var(--line);background:var(--inset);color:var(--fg)}
.alert svg{width:16px;height:16px}
.alert.warn{border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.alert.warn svg{color:var(--warn)}
.alert.danger{background:var(--danger-soft);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.alert.danger svg{color:var(--danger)}
.alert.info svg{color:var(--info)}
button.alert{cursor:pointer}
button.alert:hover{filter:brightness(1.08)}
.bbar{flex:none;border-top:1px solid var(--line);background:var(--top2);color:var(--top2-fg);padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* modal + toast */
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:24px;z-index:70}
.dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line2);border-radius:calc(var(--radius) + 2px);box-shadow:var(--shadow);max-height:100%;display:flex;flex-direction:column;width:min(900px,100%);outline:none}
.dlg-h{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;background:var(--phead);border-radius:calc(var(--radius) + 2px) calc(var(--radius) + 2px) 0 0}
.dlg-h h2{margin:0;font-size:17px;font-weight:800;color:var(--accent2)}
.dlg-b{padding:18px 20px;overflow:auto;flex:1;min-height:0}
.dlg-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--phead)}
.toast{display:flex;align-items:center;gap:10px;max-width:520px;padding:12px 16px;border-radius:var(--radius);background:var(--fg);color:var(--bg);font-size:14px;font-weight:700;box-shadow:var(--shadow)}
.selx{height:36px;border-radius:var(--radius);border:1px solid var(--line2);background:var(--inset);color:var(--fg);font-size:14px;padding:0 8px;min-width:0}
.inp{height:36px;border-radius:var(--radius);border:1px solid var(--line2);background:var(--inset);color:var(--fg);font-size:14px;padding:0 12px;min-width:0}
.inp::placeholder{color:var(--muted)}
.fl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div class="app {{ themeClass }} {{ fontClass }} {{ palClass }}" style="height: 100vh; min-height: 640px; display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 15px; line-height: 1.5; overflow: hidden; position: relative">

  <!-- ============ REVIEW STRIP (검토 도구 · 게임 UI 아님) ============ -->
  <sc-if value="{{ showReview }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; align-items: center; gap: 14px; padding: 6px 16px; background: #0B0D10; color: #E6E8EB; font-size: 13px; flex-wrap: wrap; border-bottom: 1px solid #2A2F36; flex: none; font-family: 'Noto Sans KR', sans-serif">
    <strong style="font-weight: 700">디자인 검토</strong>
    <div style="display: flex; align-items: center; gap: 6px" role="group" aria-label="스타일 전환">
      <sc-for list="{{ themes }}" as="t" hint-placeholder-count="3">
        <button class="rv-btn {{ t.cls }}" aria-pressed="{{ t.pressed }}" onClick="{{ t.pick }}"><span class="rv-sw" style="background: {{ t.sw1 }}"></span><span class="rv-sw" style="background: {{ t.sw2 }}"></span>{{ t.label }}</button>
      </sc-for>
    </div>
    <label style="display: flex; align-items: center; gap: 6px; color: #A9B0B8">C 색감
      <select class="rv-sel" value="{{ pal }}" onChange="{{ onPal }}">
        <option value="C1">C1 Teal</option>
        <option value="C2">C2 Brass</option>
        <option value="C3">C3 Steel Blue</option>
        <option value="C4">C4 Silver</option>
        <option value="C5">C5 Ember</option>
      </select>
    </label>
    <label style="display: flex; align-items: center; gap: 6px; color: #A9B0B8">글꼴
      <select class="rv-sel" value="{{ font }}" onChange="{{ onFont }}">
        <option value="F0">테마 기본</option>
        <option value="F1">F1 Noto Sans · Serif KR</option>
        <option value="F2">F2 IBM Plex KR · Mono</option>
        <option value="F3">F3 Gothic A1 · Hahmlet</option>
        <option value="F4">F4 나눔고딕 · 나눔명조</option>
        <option value="F5">F5 고운돋움 · 고운바탕</option>
        <option value="F6">F6 Noto Sans KR · JetBrains Mono</option>
        <option value="F7">F7 IBM Plex KR · Barlow 숫자</option>
        <option value="F8">F8 Orbit 제목 · IBM Plex KR</option>
        <option value="F9">F9 Gothic A1 · Rajdhani 숫자</option>
      </select>
    </label>
    <label style="display: flex; align-items: center; gap: 6px; color: #A9B0B8">UI 상태
      <select class="rv-sel" value="{{ uiState }}" onChange="{{ onUiState }}">
        <option value="normal">기본</option>
        <option value="loading">로딩</option>
        <option value="empty">빈 상태</option>
        <option value="error">오류</option>
      </select>
    </label>
    <label style="display: flex; align-items: center; gap: 6px; color: #A9B0B8">계속 버튼
      <select class="rv-sel" value="{{ contMode }}" onChange="{{ onContMode }}">
        <option value="fixture">결정 2건</option>
        <option value="clear">결정 없음</option>
      </select>
    </label>
    <span style="margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; color: #F2C27A; border: 1px dashed #F2C27A; padding: 2px 8px; border-radius: 3px">MOCK · 엔진 미연결</span>
  </div>
  </sc-if>

  <!-- ============ GLOBAL TOP BAR ============ -->
  <header class="top">
    <div style="display: flex; gap: 4px; flex: none">
      <button class="tbtn" aria-label="뒤로" disabled="{{ noBack }}" onClick="{{ back }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <button class="tbtn" aria-label="앞으로" disabled="{{ noFwd }}" onClick="{{ fwd }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <button class="brand" onClick="{{ goHome }}" aria-label="THE FIRM · 업무실로">
      <span class="mark" aria-hidden="true"></span>
      <span style="display: flex; flex-direction: column; line-height: 1.15; text-align: left">
        <span class="wordmark">THE FIRM</span>
        <span style="font-size: 11px; color: var(--top-muted); font-weight: 600">시연 로펌 · MOCK</span>
      </span>
    </button>
    <nav class="gnav" aria-label="전역 메뉴">
      <sc-for list="{{ menus }}" as="m" hint-placeholder-count="7">
        <div class="navgrp {{ m.cls }}" onKeyDown="{{ m.onKey }}">
          <button class="navbtn" aria-current="{{ m.current }}" onClick="{{ m.go }}">{{ m.label }}</button>
          <button class="navchev" aria-expanded="{{ m.expanded }}" aria-label="{{ m.chevLabel }}" onClick="{{ m.toggle }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
          <sc-if value="{{ m.open }}" hint-placeholder-val="{{ false }}">
            <div class="dd" aria-label="{{ m.chevLabel }}">
              <sc-for list="{{ m.items }}" as="it" hint-placeholder-count="3">
                <button class="{{ it.cls }}" onClick="{{ it.go }}"><span>{{ it.label }}</span><svg class="i" style="width: 14px; height: 14px" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </nav>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 6px; flex: none">
      <button class="tbtn" aria-label="검색" onClick="{{ onSearch }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14a7 7 0 1 0 0-14 M16.5 16.5L21 21"></path></svg></button>
      <button class="tbtn" aria-label="{{ msgLabel }}" onClick="{{ goInbox }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6h17v12h-17z M4 7l8 6 8-6"></path></svg><sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}"><span class="badge">{{ unread }}</span></sc-if></button>
      <button class="tbtn" aria-label="설정" onClick="{{ onSettings }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9 M17 7h3 M15 5v4 M4 17h3 M11 17h9 M9 15v4"></path></svg></button>
    </div>
    <div class="datebox">
      <span class="num" style="font-weight: 800; font-size: 15px">06.12 (금) 2026</span>
      <span style="font-size: 12px; color: var(--top-muted)">다음 기일 D-6</span>
    </div>
    <button class="cont {{ contCls }}" onClick="{{ onCont }}" aria-label="{{ contAria }}">
      <span style="display: flex; flex-direction: column; line-height: 1.2">
        <span style="font-size: 16px; font-weight: 800">{{ contLabel }}</span>
        <span style="font-size: 12px; font-weight: 700; opacity: .85">{{ contSub }}</span>
      </span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6l6 6-6 6 M12 6l6 6-6 6"></path></svg>
    </button>
  </header>
  <sc-if value="{{ ddOpen }}" hint-placeholder-val="{{ false }}"><button class="ddback" aria-label="메뉴 닫기" onClick="{{ closeDD }}"></button></sc-if>

  <!-- ============ SUB BAR ============ -->
  <div class="sub">
    <span class="ctx">{{ ctxLabel }}<sc-if value="{{ hasCtxSub }}" hint-placeholder-val="{{ false }}"><span class="muted">› {{ ctxSub }}</span></sc-if></span>
    <sc-for list="{{ subtabs }}" as="t" hint-placeholder-count="3">
      <button class="subtab {{ t.cls }}" aria-current="{{ t.current }}" onClick="{{ t.go }}">{{ t.label }}</button>
    </sc-for>
    <div style="margin-left: auto; display: flex; gap: 6px; padding-left: 16px">
      <sc-for list="{{ shortcuts }}" as="k" hint-placeholder-count="4">
        <button class="sc" onClick="{{ k.go }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="{{ k.ip }}"></path></svg>{{ k.label }}<sc-if value="{{ k.hasCount }}" hint-placeholder-val="{{ false }}"><span class="cnt {{ k.cntCls }}">{{ k.count }}</span></sc-if></button>
      </sc-for>
    </div>
  </div>

  <!-- ============ BODY ============ -->
  <div class="ground" style="flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative">

    <!-- ================= D01 · 업무실 개요 (portal) ================= -->
    <sc-if value="{{ isD01 }}" hint-placeholder-val="{{ true }}">
      <div ref="{{ mainRef }}" onScroll="{{ onMainScroll }}" style="flex: 1; min-height: 0; overflow: auto">
        <div class="d01">
          <!-- left : messages -->
          <section class="panel col" style="gap: 0; overflow: hidden" aria-label="메시지">
            <div class="phd">
              <button class="ttl" onClick="{{ goInbox }}">메시지</button>
              <span class="muted num" style="margin-left: auto; font-size: 13px">{{ unread }} 새 메시지</span>
            </div>
            <div style="display: flex; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line)" role="group" aria-label="메시지 필터">
              <sc-for list="{{ d01Tabs }}" as="f" hint-placeholder-count="3">
                <button class="ftab {{ f.cls }}" aria-pressed="{{ f.pressed }}" onClick="{{ f.pick }}">{{ f.label }}<span class="num">{{ f.count }}</span></button>
              </sc-for>
            </div>
            <div style="flex: 1; min-height: 0; overflow: auto">
              <sc-if value="{{ stLoading }}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px" aria-busy="true" aria-label="메시지 불러오는 중"><div class="skel" style="width: 40%"></div><div class="skel" style="width: 85%"></div><div class="skel" style="width: 35%"></div><div class="skel" style="width: 75%"></div><div class="skel" style="width: 45%"></div></div>
              </sc-if>
              <sc-if value="{{ stEmpty }}" hint-placeholder-val="{{ false }}"><div class="empty">새 메시지 없음</div></sc-if>
              <sc-if value="{{ stError }}" hint-placeholder-val="{{ false }}"><div class="errbox" role="alert"><div style="display: flex; flex-direction: column; gap: 8px"><strong>불러오지 못했습니다</strong><button class="btn sm" style="align-self: flex-start" onClick="{{ resetUi }}">다시 시도</button></div></div></sc-if>
              <sc-if value="{{ stNormal }}" hint-placeholder-val="{{ true }}">
                <div>

                <sc-for list="{{ plan.val }}" as="v" hint-placeholder-count="2"><button class="btn sm" onClick="{{ v.go }}">{{ v.text }}</button></sc-for>
                <button class="btn ghost iconbtn" style="margin-left: auto" aria-label="검증 결과 닫기" onClick="{{ closeVal }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
              </div>
            </sc-if>

            <div class="bbar">
              <div style="display: flex; align-items: center; gap: 4px; flex-wrap: wrap" role="group" aria-label="계획 상태">
                <sc-for list="{{ life }}" as="l" hint-placeholder-count="4"><span class="{{ l.cls }}" aria-current="{{ l.current }}">{{ l.label }}</span></sc-for>
              </div>
              <span class="muted" style="font-size: 13px">{{ plan.editSummary }}</span>
              <div style="margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap">
                <button class="btn sm" disabled="{{ noUndo }}" onClick="{{ undo }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5 M4 9h11a5 5 0 0 1 0 10h-4"></path></svg>실행 취소</button>
                <button class="btn sm" disabled="{{ noRedo }}" onClick="{{ redo }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5 M20 9H9a5 5 0 0 0 0 10h4"></path></svg>다시 실행</button>
                <button class="btn sm" disabled="{{ noEdits }}" onClick="{{ askCancel }}">되돌리기</button>
                <button class="btn sm" onClick="{{ toggleVal }}">검증 <span class="num">{{ plan.valCount }}</span></button>
                <button class="btn sm" onClick="{{ openPreview }}">미리보기</button>
                <button class="btn primary" onClick="{{ openApprove }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>계획 승인</button>
              </div>
            </div>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <!-- ================= PLACEHOLDER ================= -->
    <sc-if value="{{ isPH }}" hint-placeholder-val="{{ false }}">
      <div ref="{{ mainRef }}" onScroll="{{ onMainScroll }}" style="flex: 1; min-height: 0; overflow: auto; padding: 48px 24px">
        <div class="panel" style="max-width: 560px; margin: 0 auto">
          <div class="empty" style="padding: 40px 28px; gap: 12px">
            <span style="display: flex; gap: 8px; align-items: center"><span class="tag">추후 화면</span><sc-if value="{{ ph.hasCode }}" hint-placeholder-val="{{ false }}"><span class="tag">{{ ph.code }}</span></sc-if></span>
            <strong class="h1" style="color: var(--fg)">{{ ph.title }}</strong>
            <span>{{ ph.desc }}</span>
            <sc-if value="{{ ph.hasFacts }}" hint-placeholder-val="{{ false }}">
              <div style="display: flex; gap: 24px">
                <sc-for list="{{ ph.facts }}" as="f" hint-placeholder-count="2"><div style="display: flex; flex-direction: column"><span class="lbl">{{ f.label }}</span><span class="big" style="font-size: 20px">{{ f.value }}</span></div></sc-for>
              </div>
            </sc-if>
            <span style="display: flex; gap: 8px"><button class="btn" disabled="{{ noBack }}" onClick="{{ back }}">이전</button><button class="btn primary" onClick="{{ goHome }}">업무실</button></span>
          </div>
        </div>
      </div>
    </sc-if>
  </div>

  <!-- ================= MODALS ================= -->
  <sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
    <div class="overlay" onClick="{{ overlayClick }}">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title" tabindex="-1" ref="{{ dlgRef }}" onKeyDown="{{ dlgKey }}" style="width: min({{ dlgW }}, 100%)">

        <sc-if value="{{ mDec }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; min-height: 0; flex: 1">
            <div class="dlg-h"><h2 id="dlg-title">판단 요청</h2><span class="chip c-danger">필수 {{ pendingCount }}</span><button class="btn ghost iconbtn" style="margin-left: auto" aria-label="닫기 (보류)" onClick="{{ closeModal }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
            <div style="display: flex; flex: 1; min-height: 0; flex-wrap: wrap">
              <div style="flex: 1 1 260px; border-right: 1px solid var(--line); overflow: auto">
                <sc-for list="{{ decModalList }}" as="d" hint-placeholder-count="2">
                  <button class="li unread {{ d.cls }}" aria-current="{{ d.current }}" onClick="{{ d.pick }}"><span class="row1"><span class="num">{{ d.id }}</span><span style="margin-left: auto" class="chip c-danger">필수</span></span><span class="subj">{{ d.title }}</span><span class="muted" style="font-size: 13px">{{ d.category }}</span></button>
                </sc-for>
              </div>
              <div style="flex: 2 1 380px; padding: 20px; display: flex; flex-direction: column; gap: 14px; overflow: auto">
                <span class="lbl">{{ decCur.category }} · <span class="num">{{ decCur.id }}</span></span>
                <strong class="disp" style="font-size: 20px">{{ decCur.title }}</strong>
                <dl class="kv"><dt>출처</dt><dd>{{ decCur.source }}</dd><dt>상태</dt><dd>미해결</dd></dl>
                <div class="alert info"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0 M12 11v5.5 M12 7.6v.1"></path></svg><span>선택지는 엔진이 제공 · 자동 선택 없음</span></div>
                <button class="btn" style="align-self: flex-start" onClick="{{ decCur.goSource }}">원본 업무 보기<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14 M13 6l6 6-6 6"></path></svg></button>
              </div>
            </div>
            <div class="dlg-f"><span class="note">닫기 = 보류</span><button class="btn" style="margin-left: auto" onClick="{{ closeModal }}">닫기</button><button class="btn primary" disabled="{{ true }}">결정 확정</button></div>
          </div>
        </sc-if>

        <sc-if value="{{ mPreview }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; min-height: 0; flex: 1">
            <div class="dlg-h"><h2 id="dlg-title">변경 미리보기</h2><span class="muted num" style="font-size: 14px">{{ changeCount }}건</span><button class="btn ghost iconbtn" style="margin-left: auto" aria-label="닫기" onClick="{{ closeModal }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
            <div class="dlg-b" style="display: flex; flex-direction: column; gap: 10px">
              <sc-if value="{{ noEdits }}" hint-placeholder-val="{{ false }}"><div class="empty">변경 없음</div></sc-if>
              <sc-for list="{{ changes }}" as="c" hint-placeholder-count="2"><div class="panel" style="padding: 12px 14px; gap: 2px; background: var(--inset)"><strong>{{ c.text }}</strong><span class="note">{{ c.impact }}</span></div></sc-for>
            </div>
            <div class="dlg-f"><button class="btn" style="margin-left: auto" onClick="{{ closeModal }}">닫기</button></div>
          </div>
        </sc-if>

        <sc-if value="{{ mApprove }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; min-height: 0; flex: 1">
            <div class="dlg-h"><h2 id="dlg-title">계획 승인</h2><span class="tag">초안 v3</span><button class="btn ghost iconbtn" style="margin-left: auto" aria-label="닫기" onClick="{{ closeModal }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
            <div class="dlg-b" style="display: flex; flex-direction: column; gap: 18px">
              <div class="sect">
                <div class="sect-h"><span class="rb rb-lead" style="width: 26px">1</span><strong>변경 내용과 영향</strong></div>
                <sc-if value="{{ noEdits }}" hint-placeholder-val="{{ true }}"><span class="note">수정 없음</span></sc-if>
                <sc-for list="{{ changes }}" as="c" hint-placeholder-count="1"><div style="display: flex; flex-direction: column; padding: 8px 0; border-bottom: 1px solid var(--line)"><strong>{{ c.text }}</strong><span class="note">{{ c.impact }}</span></div></sc-for>
              </div>
              <div class="sect">
                <div class="sect-h"><span class="rb rb-lead" style="width: 26px">2</span><strong>승인 차단</strong><span class="chip c-danger">{{ blockCount }}</span></div>
                <sc-for list="{{ blockers }}" as="b" hint-placeholder-count="3"><button class="alert danger" onClick="{{ b.go }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 11h13v9.5h-13z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg><span>{{ b.text }}</span></button></sc-for>
              </div>
              <div class="sect">
                <div class="sect-h"><span class="rb rb-lead" style="width: 26px">3</span><strong>승인의 의미</strong></div>
                <div style="display: flex; gap: 8px; flex-wrap: wrap"><span class="tag">승인 ≠ 법정 실제 발언</span><span class="tag">제출 · 허용 상태 그대로</span><span class="tag">승소 가능성 계산 없음</span></div>
              </div>
            </div>
            <div class="dlg-f"><span class="note">MOCK UI</span><button class="btn" style="margin-left: auto" onClick="{{ closeModal }}">돌아가기</button><button class="btn primary" disabled="{{ approveDisabled }}" onClick="{{ doApprove }}">{{ approveLabel }}</button></div>
          </div>
        </sc-if>

        <sc-if value="{{ mCancel }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column">
            <div class="dlg-h"><h2 id="dlg-title">초안으로 되돌리기</h2></div>
            <div class="dlg-b" style="display: flex; flex-direction: column; gap: 6px"><p style="margin: 0">수정 {{ changeCount }}건을 버리고 초안 v3로 되돌립니다.</p><sc-for list="{{ changes }}" as="c" hint-placeholder-count="1"><span class="note">· {{ c.text }}</span></sc-for></div>
            <div class="dlg-f"><button class="btn" style="margin-left: auto" onClick="{{ closeModal }}">계속 편집</button><button class="btn primary" onClick="{{ doCancel }}">되돌리기</button></div>
          </div>
        </sc-if>

        <sc-if value="{{ mAssign }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; min-height: 0; flex: 1">
            <div class="dlg-h"><h2 id="dlg-title">쟁점별 담당</h2><span class="tag">초안에만 반영</span><button class="btn ghost iconbtn" style="margin-left: auto" aria-label="닫기" onClick="{{ closeModal }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
            <div class="dlg-b" style="padding-top: 4px">
              <sc-for list="{{ asgRows }}" as="a" hint-placeholder-count="3">
                <div style="display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap">
                  <div style="flex: 1 1 240px; display: flex; flex-direction: column; min-width: 0">
                    <span style="display: flex; gap: 6px; align-items: center"><span class="num muted" style="font-size: 12px">{{ a.id }}</span><sc-if value="{{ a.changed }}" hint-placeholder-val="{{ false }}"><span class="tag" style="border-style: dashed">변경</span></sc-if></span>
                    <strong>{{ a.title }}</strong>
                  </div>
                  <span class="av" aria-hidden="true">{{ a.ini }}</span>
                  <label class="fl" style="flex: 0 1 300px"><span class="sr">{{ a.id }} 담당</span>
                    <select class="selx" style="width: 100%" value="{{ a.val }}" onChange="{{ a.onChange }}">
                      <option value="이정우">이정우 · 대표 변호사 · 6h</option>
                      <option value="김현우">김현우 · 변호사 · 0h · 배정 충돌</option>
                      <option value="박서윤">박서윤 · 변호사 · 12h</option>
                      <option value="한도윤">한도윤 · 사무직원 · 4h</option>
                    </select>
                  </label>
                  <sc-if value="{{ a.hasWarn }}" hint-placeholder-val="{{ false }}"><div class="alert warn" style="flex-basis: 100%"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5 21.5 20h-19z M12 10v4.5 M12 17.2v.1"></path></svg><span>{{ a.warn }}</span></div></sc-if>
                </div>
              </sc-for>
            </div>
            <div class="dlg-f">
              <button class="btn sm" disabled="{{ asgNoUndo }}" onClick="{{ asgUndo }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5 M4 9h11a5 5 0 0 1 0 10h-4"></path></svg>실행 취소</button>
              <button class="btn sm" disabled="{{ asgNoUndo }}" onClick="{{ asgReset }}">초기화</button>
              <button class="btn" style="margin-left: auto" onClick="{{ closeModal }}">취소</button>
              <button class="btn primary" disabled="{{ asgNoChange }}" onClick="{{ asgApply }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>반영 {{ asgChangeText }}</button>
            </div>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <div aria-live="polite" style="position: absolute; right: 24px; bottom: 84px; z-index: 80; display: flex; flex-direction: column; align-items: flex-end; pointer-events: none">
    <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
      <div class="toast"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 700; border: 1px dashed currentColor; padding: 1px 5px; border-radius: 3px">MOCK</span><span>{{ toastText }}</span></div>
    </sc-if>
  </div>
</div>
</template>
