<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1220"><title>THE FIRM — Courtroom Core v0.9</title>
  <link rel="stylesheet" href="ui/original.css"><link rel="stylesheet" href="ui/courtroom.css">
</head>
<body>
  <div class="app">
    <header class="masthead"><div class="brand">THE FIRM <small>COURTROOM / 0.9</small></div><div class="case-title" id="caseTitle"></div><div class="phase"><b id="phaseLabel"></b></div></header>
    <main class="main">
      <aside class="side" id="casePanel" aria-label="사건과 전략"></aside>
      <section class="court" aria-label="법정 진행">
        <div class="scene" id="scene"></div>
        <div class="choices" id="examination"></div>
      </section>
      <aside class="side right" id="recordPanel" aria-label="법정 기록"></aside>
    </main>
    <footer class="footer"><button data-action="reset">처음부터</button></footer>
  </div>
  <dialog id="strategyDialog" aria-labelledby="strategyTitle"><h2 id="strategyTitle">변호 전략</h2><div id="strategyChoices"></div><button class="plain" id="closeStrategy">닫기</button></dialog>
  <dialog id="evidenceDialog" aria-labelledby="evidenceTitle"><h2 id="evidenceTitle"></h2><p id="evidenceText" class="compact"></p><button class="plain" id="closeEvidence">닫기</button></dialog>
  <dialog id="closingPreview" aria-labelledby="closingPreviewTitle"><h2 id="closingPreviewTitle">최종변론</h2><p id="closingPreviewText" class="closing-speech"></p><button class="plain" id="closeClosingPreview">돌아가서 수정</button><button class="plain" data-action="submitClosing">이 변론을 남긴다</button></dialog>
  <div id="notification" role="status" aria-live="polite"></div>
  <div id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <nav class="mobile-access" aria-label="빠른 이동"><button class="plain" data-action="mobile-case">쟁점 · 의뢰인 목표</button><button class="plain" data-action="open-record">법정 기록</button></nav>
  <dialog id="recordDialog" aria-labelledby="recordTitle"><div class="sheet-header"><h2 id="recordTitle">법정 기록</h2><button class="plain" id="closeRecord">닫기</button></div><div id="recordSheet"></div></dialog>
  <script src="data/case.js"></script><script src="engine/core.js"></script><script src="engine/opening.js"></script><script src="engine/procedure.js"></script><script src="engine/closing.js"></script><script src="engine/adjudication.js"></script><script src="services/courtroom.js"></script><script src="ui/app.js"></script>
</body>
</html>
