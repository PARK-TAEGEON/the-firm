name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Game tests
        run: cd game && node --test tests/*.test.js

  test:
    name: Godot tests
    # 이전 트리거만 유지한다. pull_request, main push, 수동 실행.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: litigation-skeleton

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        working-directory: .
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Legacy regressions
        run: godot --headless --path . --script res://tests/run_regressions.gd

      - name: VS-001 regressions
        run: godot --headless --path . --script res://vertical_slice/tests/run_slice_regressions.gd

      - name: VS-002 regressions
        run: godot --headless --path . --script res://vertical_slice/tests/run_vs002_regressions.gd

      - name: VS-003 regressions
        run: godot --headless --path . --script res://vertical_slice/tests/run_vs003_regressions.gd

      - name: VS-004 regressions
        run: godot --headless --path . --script res://vertical_slice/tests/run_vs004_regressions.gd

      - name: Main scene smoke
        run: godot --headless --path . --quit-after 2
