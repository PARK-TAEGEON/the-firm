name: Issue Trigger Smoke

on:
  issues:
    types: [opened]

jobs:
  smoke:
    if: contains(github.event.issue.labels.*.name, 'agent:ready')
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Show issue info
        shell: powershell
        run: |
          Write-Host "ISSUE_NUMBER=${{ github.event.issue.number }}"
          Write-Host "ISSUE_TITLE=${{ github.event.issue.title }}"
          Write-Host "RUNNER_NAME=$env:RUNNER_NAME"
